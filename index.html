* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; background: var(--pitch); overflow-x: clip; }
body { background: var(--pitch); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
::selection { background: var(--lime); color: var(--pitch); }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 20px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
h2.sec { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 7vw, 68px); line-height: .95; letter-spacing: .01em; text-wrap: balance; }
.tabular { font-variant-numeric: tabular-nums; }
.clay { color: var(--clay); } .lime { color: var(--lime); }
section { padding: 72px 0 0; }
.hint { font-size: 14px; color: var(--muted); }

/* duotone photo panel: photo in greyscale, tinted clay to lime, shaded for text */
.photo { position: relative; isolation: isolate; overflow: hidden; }
.photo::before { content: ""; position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center; filter: grayscale(1) contrast(1.1) brightness(1.05); }
.photo::after { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(180deg, rgba(10,23,18,.12), rgba(10,23,18,.82)), linear-gradient(100deg, rgba(226,112,58,.42), rgba(215,234,70,.34)); }
.photo.hold::before { background-image: var(--img-hold); }
.photo.log::before { background-image: var(--img-log); background-position: 50% 30%; }
.photo.beer::before { background-image: var(--img-beer); }

/* top bar */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(10,23,18,.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 56px; }
.brand { font-family: var(--display); font-size: 24px; letter-spacing: .06em; white-space: nowrap; }
.brand b { font-weight: 400; background: linear-gradient(90deg, var(--clay), var(--lime)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bar nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.bar nav a { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 8px 10px; border-radius: 4px; white-space: nowrap; }
.bar nav a:hover { color: var(--ink); background: var(--surface); }

/* hero */
.hero { position: relative; padding: 44px 0 56px; overflow: hidden; isolation: isolate;
  background: linear-gradient(104deg, rgba(226,112,58,.26) 0%, rgba(226,112,58,.07) 49.8%, rgba(215,234,70,.07) 50.2%, rgba(215,234,70,.20) 100%), var(--pitch); }
.court { position: absolute; z-index: -1; top: 40px; left: 50%; transform: translateX(-50%); width: min(980px, 130%); opacity: .55; }
.title { text-align: center; margin-top: 10px; }
.title h1 { font-family: var(--display); font-weight: 400; line-height: .86; font-size: clamp(76px, 17vw, 190px); letter-spacing: .01em; margin-top: 8px; }
.title h1 span { display: block; }
.title h1 .j { background: linear-gradient(90deg, var(--clay) 30%, var(--lime) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.score { margin-top: 36px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; }
.side { display: flex; align-items: center; gap: 18px; }
.side.b { flex-direction: row-reverse; text-align: right; }
.side svg { width: 76px; height: auto; flex: none; filter: drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
.side .nm { font-family: var(--display); font-size: clamp(30px, 4.6vw, 52px); line-height: .95; letter-spacing: .03em; }
.big { display: flex; align-items: baseline; justify-content: center; gap: 14px; font-family: var(--display); line-height: .8; }
.big .n { font-size: clamp(110px, 20vw, 220px); }
.big .d { font-size: clamp(50px, 8vw, 90px); color: var(--muted); }
.score-cap { text-align: center; margin-top: 8px; }
.chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: rgba(17,37,29,.8); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; }
.chip i { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

/* ticker */
.ticker { background: var(--lime); color: var(--pitch); overflow: hidden; white-space: nowrap; border-block: 2px solid var(--pitch); }
.ticker div { display: inline-flex; gap: 38px; padding: 10px 0; font-family: var(--display); font-size: 22px; letter-spacing: .06em; animation: slide 46s linear infinite; }
.ticker span::after { content: "◆"; margin-left: 38px; color: var(--clay); }
@keyframes slide { to { transform: translateX(-50%); } }

/* next clasico */
.next-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.poster { margin-top: 28px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; }
.ticket { position: relative; padding: 26px 26px 22px; background: var(--surface); border: 2px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 56%; width: 22px; height: 22px; border-radius: 50%; background: var(--pitch); border: 2px solid var(--line); }
.ticket.l::before { left: -13px; } .ticket.l::after { display: none; }
.ticket.r::after { right: -13px; } .ticket.r::before { display: none; }
.ticket .dow { font-family: var(--mono); font-size: 13px; letter-spacing: .22em; color: var(--muted); }
.ticket .dt { font-family: var(--display); font-size: clamp(72px, 11vw, 124px); line-height: .85; }
.ticket .mo { font-family: var(--display); font-size: 40px; letter-spacing: .06em; }
.ticket .in { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 12px; }
.vs { display: grid; place-items: center; padding: 0 14px; font-family: var(--display); font-size: 46px; color: var(--muted); }
.vote-note { margin-top: 20px; display: flex; align-items: center; gap: 14px; padding: 16px 20px; border: 1px solid var(--lime); border-radius: 6px; background: rgba(215,234,70,.07); font-weight: 700; }
.vote-note svg { width: 28px; height: 28px; flex: none; }
.locked { margin-top: 28px; text-align: center; padding: 36px 20px; border: 2px solid var(--lime); border-radius: 6px; background: linear-gradient(180deg, rgba(215,234,70,.1), transparent); }
.locked .dt { font-family: var(--display); font-size: clamp(56px, 11vw, 120px); line-height: .9; }
.cd { display: flex; justify-content: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.cd div { min-width: 82px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 8px; }
.cd b { display: block; font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; }
.cd small { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* record: holders banner + tale of the tape */
.holders { margin-top: 28px; border-radius: 8px; padding: 44px 28px 34px; display: grid; justify-items: center; text-align: center; gap: 8px; border: 1px solid var(--line); min-height: 330px; align-content: end; }
.holders svg { width: 92px; height: auto; filter: drop-shadow(0 10px 22px rgba(0,0,0,.55)); }
.holders .who { font-family: var(--display); font-size: clamp(48px, 9vw, 96px); line-height: .9; letter-spacing: .02em; }
.holders .line { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); opacity: .9; }
.crown { font-family: var(--mono); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; background: var(--ink); color: var(--pitch); padding: 5px 12px; border-radius: 3px; font-weight: 600; }
.tape { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 24px 24px; }
.tape-head { display: grid; grid-template-columns: 1fr 150px 1fr; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.tape-head .t { font-family: var(--display); font-size: 30px; letter-spacing: .04em; }
.tape-head .t.b { text-align: right; }
.tape-head .mid { text-align: center; font-family: var(--display); font-size: 22px; color: var(--muted); white-space: nowrap; }
.tr { display: grid; grid-template-columns: 1fr 150px 1fr; align-items: center; padding: 18px 0 4px; }
.tr .lab { text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.tr .cell { display: flex; align-items: center; gap: 12px; }
.tr .cell.a { justify-content: flex-end; } .tr .cell.b { justify-content: flex-start; }
.tr .v { font-family: var(--display); font-size: 54px; line-height: 1; min-width: 40px; }
.tr .cell.a .v { text-align: right; }
.track { position: relative; flex: 1; height: 16px; background: rgba(239,243,233,.06); }
.track i { position: absolute; top: 0; bottom: 0; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.cell.a .track { transform: skewX(-18deg); } .cell.b .track { transform: skewX(-18deg); }
.cell.a .track i { right: 0; background: var(--clay); } .cell.b .track i { left: 0; background: var(--lime); }
.formrow { display: grid; grid-template-columns: 1fr 150px 1fr; align-items: center; padding-top: 22px; }
.form { display: inline-flex; gap: 5px; }
.form em { font-style: normal; font-family: var(--mono); font-weight: 600; font-size: 13px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 4px; }
.form .w { background: var(--lime); color: var(--pitch); } .form .l { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.formrow .r { text-align: right; }

/* beers */
.tab { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tabcol { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.tabcol h3 { font-family: var(--display); font-weight: 400; font-size: 34px; letter-spacing: .03em; }
.tabcol .num { font-family: var(--display); font-size: 84px; line-height: .8; }
.glasses { display: flex; flex-wrap: wrap; gap: 6px; min-height: 76px; align-items: flex-end; }
.glasses svg { width: 44px; height: 66px; }
.stakes { margin-top: 16px; display: flex; gap: 14px; align-items: center; padding: 18px 20px; border-radius: 6px; border: 1px dashed var(--beer); background: rgba(242,177,52,.07); }
.stakes svg { width: 36px; height: 54px; flex: none; }

/* match log: fixtures on a rail */
.tl { margin-top: 32px; position: relative; display: grid; gap: 26px; padding-left: 38px; }
.tl::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(180deg, var(--lime), var(--clay) 60%, var(--line)); }
.fx { position: relative; }
.fx::before { content: ""; position: absolute; left: -35px; top: 22px; width: 18px; height: 18px; border-radius: 50%; background: var(--pitch); border: 3px solid var(--clay); }
.fx.next::before { border-color: var(--lime); border-style: dashed; }
.fx-meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.fx-main { border-radius: 8px; border: 1px solid var(--line); padding: 34px 24px 28px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; }
.tm { display: grid; justify-items: center; text-align: center; gap: 10px; position: relative; }
.tm svg { width: 78px; height: auto; filter: drop-shadow(0 10px 22px rgba(0,0,0,.5)); }
.tm .n { font-family: var(--display); font-size: clamp(28px, 4.4vw, 46px); line-height: .95; letter-spacing: .03em; }
.tm.lost svg { opacity: .55; filter: grayscale(.6) drop-shadow(0 10px 22px rgba(0,0,0,.5)); }
.tm.lost .n { opacity: .7; }
.ribbon { font-family: var(--mono); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; font-weight: 600; background: var(--ink); color: var(--pitch); padding: 4px 10px; border-radius: 3px; }
.fx-score { text-align: center; }
.fx-score .lab { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink); }
.fx-score .sc { font-family: var(--display); font-size: clamp(76px, 13vw, 150px); line-height: .85; margin: 6px 0; }
.fx-score .ft { display: inline-block; font-family: var(--display); font-size: 22px; letter-spacing: .1em; border: 2px solid var(--ink); padding: 0 12px; border-radius: 3px; }
.fx-foot { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; justify-content: space-between; margin-top: 12px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.pips { display: inline-flex; gap: 4px; vertical-align: middle; margin-right: 8px; }
.pips i { width: 18px; height: 18px; border-radius: 3px; display: block; transform: skewX(-14deg); }
.pips .a { background: var(--clay); } .pips .b { background: var(--lime); }
.fx-foot .bb { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.fx-foot .bb svg { width: 20px; height: 30px; }
.fx.next .fx-main { border: 2px dashed var(--lime); background: rgba(215,234,70,.05); grid-template-columns: 1fr; text-align: center; padding: 30px 20px; gap: 6px; }
.fx.next .nx { font-family: var(--display); font-size: clamp(34px, 6vw, 64px); line-height: .95; text-wrap: balance; }

footer { margin-top: 90px; border-top: 1px solid var(--line); padding: 30px 0 60px; color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }

@media (max-width: 780px) {
  section { padding-top: 56px; }
  .bar .wrap { height: auto; padding-block: 8px; flex-direction: column; align-items: flex-start; gap: 4px; }
  .score { grid-template-columns: 1fr 1fr; grid-template-areas: "big big" "a b"; }
  .score .big { grid-area: big; } .score .side.a { grid-area: a; } .score .side.b { grid-area: b; }
  .side, .side.b { flex-direction: column; text-align: center; gap: 8px; }
  .side svg { width: 58px; }
  .poster { grid-template-columns: 1fr; }
  .vs { padding: 8px 0; font-size: 36px; }
  .ticket::before, .ticket::after { display: none; }
  .tape { padding: 6px 14px 20px; }
  .tape-head, .tr, .formrow { grid-template-columns: 1fr 1fr; column-gap: 18px; }
  .tape-head .mid { display: none; }
  .tape-head .t { font-size: 22px; }
  .tr { row-gap: 6px; padding-top: 20px; }
  .tr .lab { grid-column: 1 / -1; grid-row: 1; }
  .formrow .lab { display: none; }
  .tr .v { font-size: 44px; min-width: 24px; }
  .tr .cell { gap: 8px; }
  .tab { grid-template-columns: 1fr; }
  .fx-main { grid-template-columns: 1fr 1fr; padding: 26px 14px 22px; }
  .fx-score { grid-column: 1 / -1; grid-row: 1; }
  .tm svg { width: 58px; }
  .tl { padding-left: 30px; } .fx::before { left: -29px; } .tl::before { left: 7px; }
  .court { width: 150%; }
}
@media (prefers-reduced-motion: reduce) {
  .ticker div { animation: none; }
  * { transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="brand">EL CLÁSICO <b>JOVEN</b></div>
    <nav aria-label="Sections">
      <a href="#score">Score</a><a href="#next">Next Clásico</a><a href="#record">The record</a><a href="#beers">Beer tab</a><a href="#history">Match log</a>
    </nav>
  </div>
</header>

<main>
<div class="hero" id="score">
  <svg class="court" viewBox="0 0 1000 500" fill="none" stroke="rgba(239,243,233,.22)" stroke-width="3" aria-hidden="true">
    <rect x="20" y="20" width="960" height="460"/>
    <line x1="500" y1="20" x2="500" y2="480" stroke-width="6"/>
    <line x1="250" y1="20" x2="250" y2="480"/><line x1="750" y1="20" x2="750" y2="480"/>
    <line x1="250" y1="250" x2="750" y2="250"/>
  </svg>
  <div class="wrap">
    <div class="title">
      <div class="eyebrow">Rivalry series · season 1</div>
      <h1><span>El Clásico</span><span class="j">Joven</span></h1>
    </div>
    <div class="score" id="scoreboard" aria-live="polite"></div>
    <div class="score-cap eyebrow" id="scorecap"></div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<div class="ticker" aria-hidden="true"><div id="ticker"></div></div>

<section id="next"><div class="wrap" id="nextwrap"></div></section>

<section id="record"><div class="wrap">
  <div class="eyebrow">Head to head</div>
  <h2 class="sec">The record</h2>
  <div class="holders photo hold" id="holders"></div>
  <div class="tape" id="tape"></div>
</div></section>

<section id="beers"><div class="wrap">
  <div class="eyebrow">The tab</div>
  <h2 class="sec">Who owes whom</h2>
  <div class="tab" id="tab"></div>
  <div class="stakes" id="stakes"></div>
</div></section>

<section id="history"><div class="wrap">
  <div class="eyebrow">Season 1</div>
  <h2 class="sec">Match log</h2>
  <div class="tl" id="tl"></div>
</div></section>
</main>

<footer><div class="wrap"><span>El Clásico Joven · Luis, Jorge, Fabio and Ben</span><span>Built from the Legends League, Tournament One and Silverstone designs.</span></div></footer>

<script>
/* ================================================================
   DATA — the only block that changes between sessions.
   To log a new Clásico, add an object to sessions. Everything else
   (scores, streaks, beer tab, bars, match log) is computed from it.
   To lock the next date, set nextMatch.confirmed to "2026-11-18".
   ================================================================ */
const DATA = {
  teams: {
    A: { name: "Luis & Jorge", members: ["Luis", "Jorge"], initials: ["L", "J"] },
    B: { name: "Ben & Fabio",  members: ["Ben", "Fabio"],  initials: ["B", "F"] }
  },
  sessions: [
    { id: 1, label: "Opening Clásico", date: null, matchesA: 2, matchesB: 1 }
  ],
  nextMatch: {
    options: ["2026-11-18", "2026-11-25"],
    confirmed: null,
    time: null
  },
  ticker: [
    "FRIENDS OFF COURT, RIVALS BETWEEN THE GLASS",
    "HISTORY IS WRITTEN IN GOLDEN POINTS",
    "TEMPORADA 1 · JORNADA 2"
  ]
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const TEAMS = DATA.teams;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const DAYS_LONG = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const daysTo = s => Math.max(0, Math.ceil((parse(s) - new Date()) / 864e5));
const fmtDate = s => { const d = parse(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()].toUpperCase()}`; };
const COLOR = { A: "#E2703A", B: "#D7EA46" };

function crest(color, ini) {
  return `<svg viewBox="0 0 100 120" role="img" aria-label="Crest ${ini.join(" and ")}">
    <path d="M50 4 L92 16 V62 C92 90 70 108 50 116 C30 108 8 90 8 62 V16 Z" fill="${color}"/>
    <path d="M50 4 L92 16 V62 C92 90 70 108 50 116 Z" fill="rgba(10,23,18,.18)"/>
    <path d="M50 4 L92 16 V62 C92 90 70 108 50 116 C30 108 8 90 8 62 V16 Z" fill="none" stroke="#0A1712" stroke-width="4"/>
    <line x1="50" y1="14" x2="50" y2="104" stroke="#0A1712" stroke-width="3" opacity=".6"/>
    <text x="30" y="72" text-anchor="middle" font-family="Bebas Neue, Impact, sans-serif" font-size="46" fill="#0A1712">${ini[0]}</text>
    <text x="70" y="72" text-anchor="middle" font-family="Bebas Neue, Impact, sans-serif" font-size="46" fill="#0A1712">${ini[1]}</text>
  </svg>`;
}
function pint(full) {
  return full
    ? `<svg viewBox="0 0 44 66" aria-hidden="true"><path d="M7 14 H37 L33 62 H11 Z" fill="#F2B134" stroke="#EFF3E9" stroke-width="2"/><path d="M9 14 C9 6 17 4 20 8 C23 3 33 5 35 14 Z" fill="#EFF3E9"/><path d="M15 24 V52 M22 24 V52" stroke="#fff" stroke-opacity=".35" stroke-width="2"/></svg>`
    : `<svg viewBox="0 0 44 66" aria-hidden="true"><path d="M7 14 H37 L33 62 H11 Z" fill="none" stroke="#8FA69C" stroke-width="2" stroke-dasharray="4 3"/></svg>`;
}
const chat = `<svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M14 3C7.9 3 3 7.4 3 12.8c0 2.3.9 4.4 2.4 6L4 24.5l5.9-2.1c1.3.5 2.7.7 4.1.7 6.1 0 11-4.4 11-9.8S20.100 3 14 3Z" stroke="#D7EA46" stroke-width="2" stroke-linejoin="round"/><path d="M9.500 12.500h9M9.500 16h5.500" stroke="#D7EA46" stroke-width="2" stroke-linecap="round"/></svg>`;

/* ---------- derived stats ---------- */
function compute() {
  const S = { sA: 0, sB: 0, mA: 0, mB: 0, rA: 0, rB: 0, formA: [], formB: [], bestA: 0, bestB: 0, log: [] };
  DATA.sessions.forEach(s => {
    S.mA += s.matchesA; S.mB += s.matchesB;
    const diff = s.matchesA - s.matchesB;
    let w = null;
    if (diff > 0) { S.sA++; S.rB++; S.bestA = Math.max(S.bestA, diff); w = "A"; S.formA.push("W"); S.formB.push("L"); }
    else if (diff < 0) { S.sB++; S.rA++; S.bestB = Math.max(S.bestB, -diff); w = "B"; S.formA.push("L"); S.formB.push("W"); }
    S.log.push({ ...s, winner: w, buyer: w === "A" ? "B" : w === "B" ? "A" : null });
  });
  const streak = f => { let n = 0; for (let i = f.length - 1; i >= 0 && f[i] === "W"; i--) n++; return n; };
  S.stA = streak(S.formA); S.stB = streak(S.formB);
  return S;
}
const S = compute();
const lead = S.mA === S.mB ? null : (S.mA > S.mB ? "A" : "B");
const holder = S.sA === S.sB ? lead : (S.sA > S.sB ? "A" : "B");

/* ---------- hero ---------- */
function renderScore() {
  const a = TEAMS.A, b = TEAMS.B;
  $("scoreboard").innerHTML = `
    <div class="side a">${crest(COLOR.A, a.initials)}<div class="nm clay">${a.name}</div></div>
    <div class="big tabular"><span class="n clay">${S.mA}</span><span class="d">–</span><span class="n lime">${S.mB}</span></div>
    <div class="side b">${crest(COLOR.B, b.initials)}<div class="nm lime">${b.name}</div></div>`;
  $("scorecap").textContent = "Overall matches won";
  const last = S.log[S.log.length - 1];
  const chips = [`<span class="chip"><i>Sessions</i><span class="tabular"><span class="clay">${S.sA}</span> – <span class="lime">${S.sB}</span></span></span>`];
  if (last && last.buyer) chips.push(`<span class="chip"><i>Last beers</i>${TEAMS[last.buyer].name} paid</span>`);
  chips.push(`<span class="chip"><i>Series leader</i>${lead ? TEAMS[lead].name : "Level"}</span>`);
  $("chips").innerHTML = chips.join("");
}
function renderTicker() {
  const nm = DATA.nextMatch;
  const when = nm.confirmed ? `NEXT CLÁSICO ${fmtDate(nm.confirmed)}` : `NEXT CLÁSICO ${nm.options.map(fmtDate).join(" OR ")}`;
  const items = [when, `${TEAMS.A.name.toUpperCase()} ${S.mA} – ${S.mB} ${TEAMS.B.name.toUpperCase()}`, ...DATA.ticker];
  const row = items.map(t => `<span>${t}</span>`).join("");
  $("ticker").innerHTML = row + row + row + row;
}

/* ---------- next clasico ---------- */
function renderNext() {
  const nm = DATA.nextMatch, w = $("nextwrap");
  if (nm.confirmed) {
    const d = parse(nm.confirmed);
    w.innerHTML = `
      <div class="eyebrow">Matchday confirmed</div>
      <h2 class="sec">¡Hay Clásico!</h2>
      <div class="locked">
        <div class="eyebrow">${TEAMS.A.name} vs ${TEAMS.B.name}</div>
        <div class="dt">${fmtDate(nm.confirmed)}</div>
        <div class="eyebrow" style="margin-top:6px">${nm.time ? "Kickoff " + nm.time : "Kickoff time to be confirmed"}</div>
        <div class="cd" id="cd"></div>
      </div>`;
    const tick = () => {
      const ms = Math.max(0, (nm.time ? new Date(nm.confirmed + "T" + nm.time) : d) - new Date());
      const v = [["Days", Math.floor(ms / 864e5)], ["Hours", Math.floor(ms / 36e5) % 24], ["Min", Math.floor(ms / 6e4) % 60], ["Sec", Math.floor(ms / 1e3) % 60]];
      $("cd").innerHTML = v.map(([l, n]) => `<div><b class="tabular">${String(n).padStart(2, "0")}</b><small>${l}</small></div>`).join("");
    };
    tick(); setInterval(tick, 1000);
    return;
  }
  const ticket = (s, side) => {
    const d = parse(s);
    return `<div class="ticket ${side}"><span class="dow">${DAYS_LONG[d.getDay()]}</span>
      <span class="dt">${d.getDate()}</span><span class="mo">${MONTHS[d.getMonth()].toUpperCase()}</span>
      <span class="in">${daysTo(s)} days to go</span></div>`;
  };
  const [d1, d2] = nm.options;
  w.innerHTML = `
    <div class="eyebrow">Jornada 2 · date to be decided</div>
    <h2 class="sec">The next Clásico</h2>
    <div class="poster">${ticket(d1, "l")}<div class="vs">OR</div>${ticket(d2, "r")}</div>
    <div class="vote-note">${chat}<span>Vote in the WhatsApp group to lock the date.</span></div>`;
}

/* ---------- the record ---------- */
function renderRecord() {
  const a = TEAMS.A, b = TEAMS.B;
  const h = holder;
  $("holders").innerHTML = h
    ? `<span class="crown">Current holders</span>${crest(COLOR[h], TEAMS[h].initials)}<div class="who">${TEAMS[h].name}</div>
       <div class="line">${S["s" + h]} ${S["s" + h] === 1 ? "session" : "sessions"} won · ${S["m" + h]} matches won</div>`
    : `<span class="crown">Level</span><div class="who">All square</div>`;
  const row = (lab, av, bv, fa, fb) => {
    const max = Math.max(av, bv, 1);
    return `<div class="tr">
      <div class="cell a"><div class="track"><i style="width:${(av / max) * 100}%"></i></div><div class="v clay tabular">${fa ?? av}</div></div>
      <div class="lab">${lab}</div>
      <div class="cell b"><div class="v lime tabular">${fb ?? bv}</div><div class="track"><i style="width:${(bv / max) * 100}%"></i></div></div></div>`;
  };
  const form = f => `<span class="form">${f.length ? f.map(x => `<em class="${x === "W" ? "w" : "l"}">${x}</em>`).join("") : ""}</span>`;
  $("tape").innerHTML =
    `<div class="tape-head"><div class="t clay">${a.name}</div><div class="mid">TALE OF THE TAPE</div><div class="t lime b">${b.name}</div></div>` +
    row("Sessions won", S.sA, S.sB) +
    row("Matches won", S.mA, S.mB) +
    row("Beer rounds paid", S.rA, S.rB) +
    row("Win streak", S.stA, S.stB, S.stA ? "W" + S.stA : "–", S.stB ? "W" + S.stB : "–") +
    row("Biggest session win", S.bestA, S.bestB, S.bestA ? "+" + S.bestA : "–", S.bestB ? "+" + S.bestB : "–") +
    `<div class="formrow"><div>${form(S.formA)}</div><div class="lab eyebrow" style="text-align:center;font-size:11px">Form</div><div class="r">${form(S.formB)}</div></div>`;
}

/* ---------- beers ---------- */
function renderBeers() {
  const col = (k, n, c) => `<div class="tabcol"><h3 class="${c}">${TEAMS[k].name}</h3>
    <div class="num tabular ${c}">${n}</div><div class="eyebrow">${n === 1 ? "Round bought" : "Rounds bought"}</div>
    <div class="glasses">${n ? Array.from({ length: n }, () => pint(true)).join("") : pint(false)}</div>
    <div class="hint">${n ? "Paid after losing a session." : "Has not bought a round yet."}</div></div>`;
  $("tab").innerHTML = col("A", S.rA, "clay") + col("B", S.rB, "lime");
  $("stakes").innerHTML = `${pint(true)}<div><b>Round ${S.rA + S.rB + 1} is on the line.</b><div class="hint">The pair that loses the next session buys the beers for the winners.</div></div>`;
}

/* ---------- match log ---------- */
function renderLog() {
  const nm = DATA.nextMatch;
  const nextLabel = nm.confirmed ? fmtDate(nm.confirmed) : nm.options.map(fmtDate).join(" or ");
  const upcoming = `<article class="fx next"><div class="fx-meta"><span>Jornada ${S.log.length + 1}</span><span>Next fixture</span></div>
    <div class="fx-main"><div class="eyebrow">${TEAMS.A.name} vs ${TEAMS.B.name}</div><div class="nx">${nextLabel}</div>
    <div class="hint">${nm.confirmed ? "Locked in. See you on court." : "Vote in the WhatsApp group to lock the date."}</div></div></article>`;
  const done = S.log.slice().reverse().map(s => {
    const team = k => {
      const lost = s.winner && s.winner !== k;
      return `<div class="tm ${lost ? "lost" : ""}">${crest(COLOR[k], TEAMS[k].initials)}<div class="n ${k === "A" ? "clay" : "lime"}">${TEAMS[k].name}</div>${s.winner === k ? '<span class="ribbon">Winners</span>' : ""}</div>`;
    };
    const pips = "<i class='a'></i>".repeat(s.matchesA) + "<i class='b'></i>".repeat(s.matchesB);
    const beer = s.buyer ? `<span class="bb">${pint(true)}${TEAMS[s.buyer].name} bought the beers</span>` : `<span class="bb">No beers owed</span>`;
    return `<article class="fx"><div class="fx-meta"><span>Jornada ${s.id}${s.date ? " · " + fmtDate(s.date) : ""}</span><span>Full time</span></div>
      <div class="fx-main photo log">${team("A")}
        <div class="fx-score"><div class="lab">${s.label}</div><div class="sc tabular"><span class="clay">${s.matchesA}</span> – <span class="lime">${s.matchesB}</span></div><span class="ft">FT</span></div>
        ${team("B")}</div>
      <div class="fx-foot"><span><span class="pips">${pips}</span><span class="hint">Matches won</span></span>${beer}</div></article>`;
  }).join("");
  $("tl").innerHTML = upcoming + done;
}

/* ---------- nav ---------- */
document.querySelectorAll(".bar nav a").forEach(a => a.addEventListener("click", e => {
  e.preventDefault();
  const el = document.getElementById(a.getAttribute("href").slice(1));
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}));

renderScore(); renderTicker(); renderNext(); renderRecord(); renderBeers(); renderLog();
</script>
</body>
</html>
